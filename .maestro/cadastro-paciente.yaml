# Autocadastro de paciente contra o backend REAL: cria a conta, entra automaticamente e cai na
# Home do paciente; confere a caixa de conversas vazia e sai pelo menu. Email duplicado → 409.
appId: host.exp.exponent
name: Paciente — autocadastro e email duplicado
tags:
  - backend
env:
  METRO_URL: exp://10.0.2.2:8081
---
- evalScript: ${output.email = 'paciente.' + Date.now() + '@fisiotech.test'}
- clearState
- runFlow: subflows/abrir-app.yaml
- tapOn:
    id: 'aba-cadastrar'
- assertVisible: 'Cadastro de paciente'
- tapOn:
    id: 'cadastro-nome'
- inputText: 'Paciente Cadastro E2E'
- pressKey: Enter
- inputText: ${output.email}
- pressKey: Enter
- inputText: 'senha-e2e-123'
- pressKey: Enter
- extendedWaitUntil:
    visible: 'Bem-vindo,'
    timeout: 30000
- assertVisible: 'Paciente Cadastro E2E'
- tapOn:
    id: 'tab-mensagens'
- extendedWaitUntil:
    visible: 'Conversas'
    timeout: 15000
- assertVisible: 'Nenhuma conversa disponível. As conversas com seus profissionais aparecerão aqui.'
- tapOn:
    id: 'tab-home'
- tapOn:
    id: 'paciente-avatar'
- tapOn:
    id: 'menu-sair'
- extendedWaitUntil:
    visible: 'Acesse sua conta'
    timeout: 15000

# Mesmo email de novo → 409.
- tapOn:
    id: 'aba-cadastrar'
- tapOn:
    id: 'cadastro-nome'
- inputText: 'Outra Pessoa'
- pressKey: Enter
- inputText: ${output.email}
- pressKey: Enter
- inputText: 'senha-e2e-123'
- pressKey: Enter
- extendedWaitUntil:
    visible: 'Já existe uma conta com este email.'
    timeout: 20000
