# Smoke test: o app abre no Expo Go e, sem sessão salva, mostra o login.
#
# Pré-requisitos: emulador aberto, `npm start` rodando e Expo Go instalado no emulador.
# Rodar: npm run test:e2e (relatórios e screenshots em .maestro/reports/)
# Para outro endereço do Metro: maestro test -e METRO_URL=exp://<ip>:8081 .maestro/smoke.yaml
appId: host.exp.exponent
name: Smoke — app abre no login
tags:
  - smoke
env:
  METRO_URL: exp://10.0.2.2:8081
---
# Apaga os dados do Expo Go (inclusive a sessão salva) para começar deslogado.
- clearState
- runFlow: subflows/abrir-app.yaml
- assertVisible: 'Acesse sua conta'
- assertVisible:
    id: 'login-entrar'
- assertVisible: 'Cadastrar'
- takeScreenshot: smoke-login
