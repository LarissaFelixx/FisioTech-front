# Minhas Consultas (#39) contra o backend REAL: a consulta online com Unimed que o seed marca
# para daqui a uma hora aparece na lista, abre o detalhe, e "Marcar Consulta" abre a marcação.
# O filtro (S5-04) separa as próximas da consulta realizada do seed.
appId: host.exp.exponent
name: Paciente — minhas consultas
tags:
  - backend
env:
  METRO_URL: exp://10.0.2.2:8081
---
- runFlow: subflows/login-paciente.yaml
- tapOn:
    id: 'tab-consultas'
- extendedWaitUntil:
    visible:
      id: 'consultas-lista'
    timeout: 15000
- assertVisible: 'Minhas Consultas'
- assertVisible: '\d{2}/\d{2}/\d{4} \d{2}:\d{2} · Online'
- assertVisible: 'Unimed'
- assertVisible: 'Agendada'

# Filtro: "Realizadas" só tem a realizada do seed; "Próximas" só as agendadas/confirmadas.
- tapOn:
    id: 'consultas-filtro-realizadas'
- assertVisible: 'Realizada'
- assertNotVisible: 'Agendada'
- tapOn:
    id: 'consultas-filtro-proximas'
- assertVisible: 'Agendada'
- assertNotVisible: 'Realizada'
- tapOn:
    id: 'consultas-filtro-todas'

# A consulta abre o detalhe.
- tapOn: '\d{2}/\d{2}/\d{4} \d{2}:\d{2} · Online'
- extendedWaitUntil:
    visible:
      id: 'consulta-paciente'
    timeout: 10000
- back

# "Marcar Consulta" abre a marcação.
- tapOn:
    id: 'consultas-marcar'
- extendedWaitUntil:
    visible: 'Marcar consulta'
    timeout: 10000
