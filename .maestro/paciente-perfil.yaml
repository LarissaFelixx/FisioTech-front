# Atividade #44: Meu Perfil contra o backend REAL.
# Aba Perfil → nascimento no futuro é recusado → edita nascimento, sexo e telefone → salva → o
# toast de sucesso some sozinho → entra de novo: dados persistidos.
appId: host.exp.exponent
name: Paciente — meu perfil
tags:
  - backend
env:
  METRO_URL: exp://10.0.2.2:8081
---
- evalScript: ${output.telefone = '8599' + String(Date.now()).slice(-7)}
- runFlow: subflows/login-paciente.yaml
- tapOn:
    id: 'tab-perfil'
- extendedWaitUntil:
    visible: 'Cadastrado em .*'
    timeout: 20000
- assertVisible: 'Meu Perfil'
- assertVisible: 'Maria Paciente E2E'

# O toque vai na ponta direita do campo: no Android o cursor fica onde se toca, e o eraseText
# apaga para trás.
- tapOn:
    id: 'perfil-dataNascimento'
    point: '95%,50%'
- runFlow: subflows/fechar-popup-teclado.yaml
- eraseText: 12
- inputText: '01012999'
- hideKeyboard
- tapOn:
    id: 'perfil-salvar'
- extendedWaitUntil:
    visible: 'A data de nascimento não pode estar no futuro.'
    timeout: 10000
- tapOn:
    id: 'perfil-dataNascimento'
    point: '95%,50%'
- eraseText: 12
- inputText: '14051990'
# Fecha o teclado antes de seguir: com ele aberto o layout se desloca e o próximo toque pode não
# mudar o foco de campo.
- hideKeyboard
- tapOn:
    id: 'perfil-sexo-Feminino'
- scrollUntilVisible:
    element:
      id: 'perfil-telefone'
    direction: DOWN
- tapOn:
    id: 'perfil-telefone'
- eraseText: 20
- inputText: ${output.telefone}
- hideKeyboard
- takeScreenshot: paciente-perfil
- tapOn:
    id: 'perfil-salvar'
- extendedWaitUntil:
    visible: 'Perfil atualizado com sucesso.'
    timeout: 20000
# É um toast: some sozinho, sem editar nenhum campo.
- extendedWaitUntil:
    notVisible: 'Perfil atualizado com sucesso.'
    timeout: 10000

# Entra de novo do zero: o perfil é relido do backend.
- runFlow: subflows/login-paciente.yaml
- tapOn:
    id: 'tab-perfil'
- extendedWaitUntil:
    visible: '14/05/1990'
    timeout: 20000
- scrollUntilVisible:
    element: ${output.telefone}
    direction: DOWN
