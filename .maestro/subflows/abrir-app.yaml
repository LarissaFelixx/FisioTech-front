# Abre o app no Expo Go e trata o menu de desenvolvedor, se ele aparecer.
#
# Após vários `stopApp` seguidos, o Android às vezes ignora o link ou o Expo Go falha ao
# baixar o bundle do Metro. Isso é do ambiente de teste, não do app, então o link é reaberto.
appId: host.exp.exponent
---
- retry:
    maxRetries: 2
    commands:
      - openLink: ${METRO_URL}
      - extendedWaitUntil:
          visible: 'Acesse sua conta|Bem-vindo\(a\),|Não foi possível conectar|Continue'
          timeout: 60000
# Duas passadas: o menu pode surgir alguns segundos depois de o app carregar.
- runFlow: tratar-menu-expo.yaml
- runFlow: tratar-menu-expo.yaml
- extendedWaitUntil:
    visible: 'Acesse sua conta|Bem-vindo\(a\),|Não foi possível conectar'
    timeout: 60000
